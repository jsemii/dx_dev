spring.application.name=wifi-care-voice
spring.config.import=optional:file:./secrets/application-local.properties,optional:file:../.env.local[.properties]
server.address=${VOICE_HOST:0.0.0.0}
server.port=${VOICE_PORT:8081}
elevenlabs.api-key=${ELEVENLABS_API_KEY:}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
logging.level.org.springframework.web=INFO
server.forward-headers-strategy=framework
alarm.delivery.enabled=${ALARM_DELIVERY_ENABLED:false}
alarm.delivery.scan-interval-ms=${ALARM_SCAN_INTERVAL_MS:5000}
alarm.delivery.grace-ms=${ALARM_DELIVERY_GRACE_MS:120000}
alarm.delivery.max-audio-bytes=${ALARM_AUDIO_MAX_BYTES:1048576}
alarm.delivery.anger-base-url=${ANGER_INTERNAL_BASE_URL:http://127.0.0.1:3001}
alarm.delivery.internal-token=${PLAYBACK_INTERNAL_TOKEN:}
alarm.delivery.request-timeout-ms=${ALARM_PLAYBACK_TIMEOUT_MS:150000}
alarm.delivery.escalation-seconds=${ALARM_ESCALATION_SECONDS:90}
