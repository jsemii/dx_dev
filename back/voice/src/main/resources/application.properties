spring.application.name=wifi-care-voice
spring.config.import=optional:file:./secrets/application-local.properties,optional:file:../.env.local[.properties]
server.address=${VOICE_HOST:127.0.0.1}
server.port=${VOICE_PORT:8081}
elevenlabs.api-key=${ELEVENLABS_API_KEY:}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
logging.level.org.springframework.web=INFO
server.forward-headers-strategy=framework