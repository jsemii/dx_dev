server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 음성 업로드 때문에 기본 1MB보다 크게
    client_max_body_size 30m;

    # OpenAI / ElevenLabs 요청 시간 고려
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # Docker recreates backend containers with new internal IPs during deploys.
    # Resolve service names at request time instead of keeping the startup IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $report_backend nulbom-report;
    set $voice_backend nulbom-voice;
    set $appliance_backend nulbom-appliance;


    # -------------------------
    # Daily Report
    # -------------------------
    location ^~ /api/v1/reports {
        proxy_pass http://$report_backend:8002;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }


    # -------------------------
    # Voice
    # -------------------------
    location ^~ /api/voice {
        proxy_pass http://$voice_backend:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /api/content {
        proxy_pass http://$voice_backend:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /api/alarms {
        proxy_pass http://$voice_backend:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/tts {
        proxy_pass http://$voice_backend:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/config/elevenlabs {
        proxy_pass http://$voice_backend:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }


    # -------------------------
    # Appliance
    # 반드시 마지막 generic /api/
    # -------------------------
    location ^~ /api/ {
        proxy_pass http://$appliance_backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }


    # React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
